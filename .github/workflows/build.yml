name: Build SaveBox Packages (Debug APK, Release APK & Play Store AAB)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Debug APK, Release APK & Play Store Bundle (AAB)
        run: ./gradlew assembleDebug assembleRelease bundleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Play Store Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: release-playstore-aab
          path: app/build/outputs/bundle/release/app-release.aab
